[package]
name = "app"
version = "0.2.0"
description = "Open Gen Studio"
authors = ["you"]
license = "Elastic-2.0"
repository = "https://github.com/Jamie-Fairweather/open-gen-studio"
edition = "2021"
rust-version = "1.77.2"
default-run = "app"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# Dev-only: regenerate frontend/lib/generated/bindings.ts (`npm run ipc:types`).
# Package default-run is `app` (main.rs) so `tauri dev` / `cargo run` stay unambiguous.
name = "export-ipc"
path = "src/bin/export_ipc.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
url = "2"
sha2 = "0.10"
# Platform backends are feature-gated; without them keyring falls back to an
# in-memory mock that does not survive Entry recreation / process restart.
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
] }
sevenz-rust2 = "0.21"
rfd = "0.15"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
arboard = "3"
# IPC: Specta 2.0.0-rc.25 (last RC before stable) + tauri-specta typed commands.
# See docs/contributing/coding-standards.md and docs/contributing/dev-notes-specta-v2.md
specta = { version = "=2.0.0-rc.25", features = ["derive", "function", "serde_json"] }
specta-serde = "=0.0.12"
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
] }
